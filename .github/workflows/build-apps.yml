name: Build Apps (APK + EXE)

# 手动触发：Actions 页点 "Run workflow"，或 gh workflow run。
# 在公开源仓库验证打包。正式安装包按私有更新库的流程分发。
on:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Sync web assets into Android project
        run: |
          npm run sync-web
          npx cap sync android
      - name: Verify Android debug build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows installers (NSIS + portable)
        run: npx electron-builder --win --publish never
